<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="start.css">
    <title>Mario and Luigi Shattered Crystal</title>
</head>

<body style="--bg-color: #F00;">


<svg width="0" height="0" style="position:absolute;">
  <defs>
    <filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="92" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2" result="blurred"/>
      <feDisplacementMap in="SourceGraphic" in2="blurred" scale="150"
        xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div class="background_box"></div>

<div class="liquid-glass-card">
    <div class="menu-button" id="start">Start</div>
    <hr class="Seperator_start">
    <div class="menu-button" id="download">Download</div>
    <hr class="Seperator">
    <div class="menu-button" id="news">News</div>
    <hr class="news_Seperator">
    <div class="menu-button" id="support">Support</div>
    <hr class="support_Seperator">
    <div class="menu-button" id="team">Team</div>
</div>

<div class="title">
    <img src="Introducing_Letters/I.png" class="letter" style="--i:0">
    <img src="Introducing_Letters/n.png" class="letter" style="--i:1">
    <img src="Introducing_Letters/t.png" class="letter" style="--i:2">
    <img src="Introducing_Letters/r.png" class="letter" style="--i:3">
    <img src="Introducing_Letters/o.png" class="letter" style="--i:4">
    <img src="Introducing_Letters/d.png" class="letter" style="--i:5">
    <img src="Introducing_Letters/u.png" class="letter" style="--i:6">
    <img src="Introducing_Letters/c.png" class="letter" style="--i:7">
    <img src="Introducing_Letters/i_klein.png" class="letter" style="--i:8">
    <img src="Introducing_Letters/n.png" class="letter" style="--i:9">
    <img src="Introducing_Letters/g.png" class="letter" style="--i:10">
    <img src="Introducing_Letters/....png" class="letter" style="--i:11">
</div>
<img src="Logo.png" class="logo">

<img src="Logo_Shadow.png" class="logo_shadow">

<video id="bg-video" autoplay muted loop playsinline preload="auto">
    <source src="bg-video.mp4" type="video/mp4">
</video>


<script src="script.js"></script>

</body>
</html>
