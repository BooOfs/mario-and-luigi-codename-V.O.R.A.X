<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="download.css">
    <title>Mario and Luigi Shattered Crystal</title>
</head>
<meta charset="UTF-8">
<body>


<svg width="0" height="0" style="position:absolute;">
  <defs>
    <filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="92" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2" result="blurred"/>
      <feDisplacementMap in="SourceGraphic" in2="blurred" scale="150"
        xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div class="background_box"></div>

<div class="liquid-glass-card">
    <div class="menu-button" id="start">Start</div>
    <hr class="Seperator_start">
    <div class="menu-button" id="download">Download</div>
    <hr class="Seperator">
    <div class="menu-button" id="news">News</div>
    <hr class="news_Seperator">
    <div class="menu-button" id="support">Support</div>
    <hr class="support_Seperator">
    <div class="menu-button" id="team">Team</div>
</div>

<div class="chapter_buttons">
    <div class="chapter_button" data-chapter="1">Chapter 1</div>
    <div class="chapter_button" data-chapter="2">Chapter 2</div>
    <div class="chapter_button" data-chapter="3">Chapter 3</div>
    <div class="chapter_button" data-chapter="4">Chapter 4</div>
</div>
    
<div class="ChapterContents">
    <img class="preview_image" src="">
    <div id="preview_dots" data-id="1"></div>
    <div class="arrows_background"data_text="🢀">    
        <div class="forward_arrow" data_text="🢂">🢂</div>
        <div class="back_arrow"data_text="🢀">🢀</div>
        <div class="middle_symbol"data_text="-" number="3">-</div>
    </div>
</div>

    
<div class="description_box">
    <div class="description_text" data-text=""></div>
    <div class="download_box">Download</div>
</div> 

    
    
    
    
<video autoplay muted loop id="bg-video">
    <source src="bg-video.mp4" type="video/mp4">
</video>


<script src="script.js"></script>
<script src="downloads_script.js"></script>
</body>
</html>
