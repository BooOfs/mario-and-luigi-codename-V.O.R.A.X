<body>
  <video id="bg" autoplay loop muted>
    <source src="bg.mp4">
  </video>

  <div id="content"></div>

  <script>
    async function load(page) {
      const html = await fetch(page).then(r => r.text());
      document.getElementById("content").innerHTML = html;
    }

    load("start.html");
  </script>
</body>
